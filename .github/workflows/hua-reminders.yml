name: Hua reminders

# Sends Hua's daily lock-screen reminders (backend/send_reminders.py) by hand only.
# The every-15-minutes run now happens on the server (deploy/linghua-reminders.cron),
# because the repo is private and a schedule here would use up the free Actions minutes.
# Needs these in Settings > Secrets and variables > Actions to work:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT
on:
  workflow_dispatch:

concurrency:
  group: hua-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/send_reminders.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "pywebpush==2.0.3" "requests==2.32.3"
      - run: python backend/send_reminders.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
